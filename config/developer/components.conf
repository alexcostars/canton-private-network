canton.features.enable-testing-commands = yes

canton {
  sequencers {
    sequencer1 {
      storage.type = memory
      public-api {
        address = 0.0.0.0
        port = 5018
      }
      admin-api {
        address = 0.0.0.0
        port = 5019
      }
    }
  }
  mediators {
    mediator1 {
      storage.type = memory
      admin-api.port = 5020
    }
  }
  participants {
    participant1 {
      storage.type = memory
      admin-api {
        # Permitir conexões de fora do host local
        address = 0.0.0.0
        port = 5001
