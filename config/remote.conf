canton.features.enable-testing-commands = yes

canton {
  participants {
    participant1 {
      storage.type = memory
      admin-api {
        # Permitir conexões de fora do host local
        address = 0.0.0.0
        port = 5001
        # Aumentando para 30MB
        max-inbound-message-size = 31457280
      }
      ledger-api {
        # Permitir conexões de fora do host local
        address = 0.0.0.0
        port = 5002
        # Aumentando para 30MB
        max-inbound-message-size = 31457280
      }
    }
    participant2 {
      storage.type = memory
      admin-api.port = 5011
      ledger-api {
        # Permitir conexões de fora do host local
        address = 0.0.0.0
        port = 5012
        # Aumentando para 30MB
        max-inbound-message-size = 31457280
      }
    }
  }
  domains {
    localdomain {
      storage.type = memory
      public-api.port = 5018
      admin-api.port = 5019
    }
  }
}